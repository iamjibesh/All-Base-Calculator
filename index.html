<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi-Base Calculator</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#4285f4" />
    <link rel="apple-touch-icon" href="icon-192.png" />

    <style>
      /* LIGHT MODE VARIABLES - Fixed for high contrast and readability */
      :root {
        --text-color: #2c3e50; /* Deep slate gray for readable text */
        --glass-bg: rgba(255, 255, 255, 0.4); /* More opaque white frost */
        --glass-border: rgba(255, 255, 255, 0.6);
        --glass-shadow: rgba(0, 0, 0, 0.1);
        --input-bg: rgba(255, 255, 255, 0.6);
        --btn-bg: rgba(255, 255, 255, 0.7);
        --btn-hover: rgba(255, 255, 255, 0.9);
        --highlight: #d35400; /* A warm, dark accent color */
      }

      [data-theme="dark"] {
        --text-color: #e8eaed;
        --glass-bg: rgba(0, 0, 0, 0.4);
        --glass-border: rgba(255, 255, 255, 0.1);
        --glass-shadow: rgba(0, 0, 0, 0.5);
        --input-bg: rgba(0, 0, 0, 0.3);
        --btn-bg: rgba(0, 0, 0, 0.5);
        --btn-hover: rgba(255, 255, 255, 0.2);
        --highlight: #8ab4f8;
      }

      /* Updated Placeholders for better contrast in both modes */
      input::placeholder {
        color: rgba(44, 62, 80, 0.6); /* Dark gray placeholder for light mode */
      }

      [data-theme="dark"] input::placeholder {
        color: rgba(232, 234, 237, 0.5); /* Light placeholder for dark mode */
      }

      /* Fix the dropdown options so they match the theme */
      option {
        background: #ffffff;
        color: #2c3e50;
      }

      [data-theme="dark"] option {
        background: #333333;
        color: #ffffff;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      /* Animated Liquid Background */
      /* Static Gradient Background */
      /* Static Warm Gradient Background */
      /* Static Earthy Gradient Background */
      body {
        min-height: 100vh;
        color: var(--text-color);
        /* A soft, muted sand gradient */
        background: linear-gradient(135deg, #eacda3 0%, #d6ae7b 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        transition:
          background 0.5s ease,
          color 0.3s ease;
      }

      [data-theme="dark"] body {
        /* A dark, warm charcoal brown */
        background: linear-gradient(135deg, #2b1f1c 0%, #121212 100%);
      }

      @keyframes gradientBG {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      /* Glassmorphism Container */
      .glass-panel {
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        box-shadow: 0 8px 32px var(--glass-shadow);
        width: 100%;
        max-width: 800px;
        padding: 30px;
        transition: all 0.3s ease;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
      }

      h1 {
        font-size: 1.8rem;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
      }

      .theme-toggle button {
        background: var(--btn-bg);
        border: 1px solid var(--glass-border);
        color: var(--text-color);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        cursor: pointer;
        font-size: 1.2rem;
        backdrop-filter: blur(4px);
        transition: background 0.3s;
      }

      .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 25px;
        background: var(--input-bg);
        padding: 5px;
        border-radius: 12px;
      }

      .tab {
        flex: 1;
        padding: 12px;
        background: transparent;
        border: none;
        border-radius: 8px;
        color: var(--text-color);
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .tab.active {
        background: var(--btn-bg);
        box-shadow: 0 4px 12px var(--glass-shadow);
      }

      .tab-content {
        display: none;
        animation: fadeIn 0.4s ease;
      }

      .tab-content.active {
        display: block;
      }

      /* Mobile Tab Dropdown Styling */
      .mobile-tabs {
        display: none; /* Hidden on desktop */
        width: 100%;
        padding: 12px 15px;
        margin-bottom: 25px;
        background: var(--input-bg);
        border: 1px solid var(--glass-border);
        color: var(--text-color);
        border-radius: 10px;
        font-size: 1.1rem;
        font-weight: bold;
        outline: none;
        backdrop-filter: blur(4px);
        cursor: pointer;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Inputs & Buttons - Glass Style */
      .input-group {
        margin-bottom: 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        align-items: center;
      }

      input,
      select {
        padding: 12px 15px;
        border: 1px solid var(--glass-border);
        border-radius: 10px;
        background: var(--input-bg);
        color: var(--text-color);
        outline: none;
        font-size: 1rem;
        backdrop-filter: blur(4px);
      }

      input::placeholder {
        color: rgba(255, 255, 255, 0.6);
      }

      [data-theme="dark"] input::placeholder {
        color: rgba(232, 234, 237, 0.5);
      }

      input:focus,
      select:focus {
        border-color: var(--highlight);
        box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
      }

      option {
        background: #333;
        color: #fff;
      }

      button.action-btn {
        padding: 12px 20px;
        border: 1px solid var(--glass-border);
        border-radius: 10px;
        background: var(--btn-bg);
        color: var(--text-color);
        cursor: pointer;
        font-weight: bold;
        transition: all 0.3s ease;
        backdrop-filter: blur(4px);
      }

      button.action-btn:hover {
        background: var(--btn-hover);
        transform: translateY(-2px);
      }

      /* Results Area */
      .result-box {
        background: var(--input-bg);
        border: 1px solid var(--glass-border);
        border-radius: 10px;
        padding: 20px;
        margin-top: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 1.2rem;
        font-weight: bold;
        letter-spacing: 1px;
      }

      .history-list {
        list-style: none;
        max-height: 300px;
        overflow-y: auto;
      }

      .history-list li {
        background: var(--input-bg);
        margin-bottom: 10px;
        padding: 15px;
        border-radius: 10px;
        border: 1px solid var(--glass-border);
        display: flex;
        justify-content: space-between;
      }

      .footer {
        margin-top: 30px;
        text-align: center;
        font-size: 0.9rem;
        opacity: 0.8;
      }

      .footer a {
        color: var(--highlight);
        text-decoration: none;
        font-weight: bold;
      }

      .bitwise {
        display: none;
      }

      @media (max-width: 600px) {
        .input-group {
          flex-direction: column;
          align-items: stretch;
        }
        .glass-panel {
          padding: 20px;
        }

        /* Hide the button tabs and show the dropdown */
        .tabs {
          display: none;
        }
        .mobile-tabs {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <div class="glass-panel">
      <header>
        <h1>Multi-Base Calculator</h1>
        <div class="theme-toggle">
          <button id="theme-btn">🌙</button>
        </div>
      </header>

      <div class="tabs">
        <button class="tab active" data-tab="calculator">Calculator</button>
        <button class="tab" data-tab="converter">Converter</button>
        <button class="tab" data-tab="history">History</button>
      </div>

      <select id="mobile-tabs" class="mobile-tabs">
        <option value="calculator">Calculator</option>
        <option value="converter">Converter</option>
        <option value="history">History</option>
      </select>

      <div id="calculator" class="tab-content active">
        <div class="input-group">
          <label for="base-selector">Base:</label>
          <select id="base-selector"></select>
          <span
            id="digits-info"
            style="font-size: 0.8rem; opacity: 0.8; margin-left: 10px"
          ></span>
        </div>

        <div class="input-group">
          <input
            type="text"
            id="operand1"
            placeholder="First number"
            style="flex: 1"
          />
          <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="×">×</option>
            <option value="÷">÷</option>
            <option value="&" class="bitwise">AND (&)</option>
            <option value="|" class="bitwise">OR (|)</option>
            <option value="^" class="bitwise">XOR (^)</option>
            <option value="<<" class="bitwise">Left Shift (<<)</option>
            <option value=">>" class="bitwise">Right Shift (>>)</option>
          </select>
          <input
            type="text"
            id="operand2"
            placeholder="Second number"
            style="flex: 1"
          />
        </div>

        <div class="input-group">
          <button class="action-btn" id="calculate" style="flex: 2">
            Calculate
          </button>
          <button class="action-btn" id="clear-all" style="flex: 1">
            Clear
          </button>
        </div>

        <div class="result-box">
          <div id="result">Result will appear here</div>
          <button class="action-btn" id="copy-result" title="Copy">📋</button>
        </div>
      </div>

      <div id="converter" class="tab-content">
        <div class="input-group">
          <input
            type="text"
            id="number-to-convert"
            placeholder="Enter number"
            style="flex: 1"
          />
        </div>
        <div class="input-group">
          <label>From:</label>
          <select id="from-base" style="flex: 1"></select>
          <label>To:</label>
          <select id="to-base" style="flex: 1"></select>
        </div>
        <button class="action-btn" id="convert-btn" style="width: 100%">
          Convert
        </button>

        <div class="result-box">
          <div id="conversion-result">Conversion result will appear here</div>
        </div>
      </div>

      <div id="history" class="tab-content">
        <button
          class="action-btn"
          id="clear-history"
          style="width: 100%; margin-bottom: 15px"
        >
          Clear History
        </button>
        <ul class="history-list" id="history-list"></ul>
      </div>

      <div class="footer">
        <p>
          Created by
          <a href="https://fb.com/jibeshsaha/" target="_blank">Jibesh Saha</a>
        </p>
      </div>
    </div>

    <script>
      // --- Service Worker Registration for PWA ---
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("sw.js")
            .then((reg) => console.log("Service Worker registered"))
            .catch((err) =>
              console.log("Service Worker registration failed:", err),
            );
        });
      }

      // --- Original Calculator Logic ---
      document.addEventListener("DOMContentLoaded", function () {
        const themeBtn = document.getElementById("theme-btn");
        const tabs = document.querySelectorAll(".tab");
        const tabContents = document.querySelectorAll(".tab-content");

        const baseSelector = document.getElementById("base-selector");
        const operand1 = document.getElementById("operand1");
        const operand2 = document.getElementById("operand2");
        const operator = document.getElementById("operator");
        const calculateBtn = document.getElementById("calculate");
        const clearAllBtn = document.getElementById("clear-all");
        const resultDisplay = document.getElementById("result");
        const copyResultBtn = document.getElementById("copy-result");
        const digitsInfo = document.getElementById("digits-info");

        const fromBase = document.getElementById("from-base");
        const toBase = document.getElementById("to-base");
        const numberToConvert = document.getElementById("number-to-convert");
        const convertBtn = document.getElementById("convert-btn");
        const conversionResult = document.getElementById("conversion-result");

        const historyList = document.getElementById("history-list");
        const clearHistoryBtn = document.getElementById("clear-history");
        const mobileTabs = document.getElementById("mobile-tabs");

        // Theme toggle
        themeBtn.addEventListener("click", function () {
          document.body.dataset.theme =
            document.body.dataset.theme === "dark" ? "light" : "dark";
          themeBtn.textContent =
            document.body.dataset.theme === "dark" ? "☀️" : "🌙";
          localStorage.setItem("theme", document.body.dataset.theme);
        });

        const savedTheme = localStorage.getItem("theme") || "light";
        document.body.dataset.theme = savedTheme;
        themeBtn.textContent = savedTheme === "dark" ? "☀️" : "🌙";

        // Tabs
        tabs.forEach((tab) => {
          tab.addEventListener("click", function () {
            tabs.forEach((t) => t.classList.remove("active"));
            tabContents.forEach((c) => c.classList.remove("active"));
            this.classList.add("active");
            document.getElementById(this.dataset.tab).classList.add("active");
          });
        });

        // New Mobile Dropdown Logic
        mobileTabs.addEventListener("change", function () {
          // Hide all contents
          tabContents.forEach((c) => c.classList.remove("active"));
          // Remove active class from desktop tabs
          tabs.forEach((t) => t.classList.remove("active"));

          // Show the selected content
          const targetTab = this.value;
          document.getElementById(targetTab).classList.add("active");

          // Keep desktop tabs in sync
          document
            .querySelector(`.tab[data-tab="${targetTab}"]`)
            .classList.add("active");
        });

        function populateBaseSelectors(selectElement, defaultBase = 10) {
          for (let i = 2; i <= 26; i++) {
            const option = document.createElement("option");
            option.value = i;
            option.textContent = i;
            if (i === defaultBase) option.selected = true;
            selectElement.appendChild(option);
          }
        }

        populateBaseSelectors(baseSelector);
        populateBaseSelectors(fromBase);
        populateBaseSelectors(toBase, 16);

        function updateBitwiseOperators(base) {
          const showBitwise = [2, 4, 8, 16].includes(base);
          document.querySelectorAll(".bitwise").forEach((op) => {
            op.style.display = showBitwise ? "block" : "none";
          });
        }

        function parseBase26(str) {
          str = str.toUpperCase();
          let result = 0;
          for (let i = 0; i < str.length; i++) {
            const c = str[i];
            if (c === ".") continue;
            if (c < "A" || c > "Z") return NaN;
            result = result * 26 + (c.charCodeAt(0) - 65);
          }
          return result;
        }

        function toBase26(num) {
          if (num === 0) return "A";
          let str = "";
          while (num > 0) {
            str = String.fromCharCode(65 + (num % 26)) + str;
            num = Math.floor(num / 26);
          }
          return str || "A";
        }

        baseSelector.addEventListener("change", function () {
          const newBase = parseInt(this.value);
          updateDigitsInfo(newBase);
          updateBitwiseOperators(newBase);
          operand1.value = "";
          operand2.value = "";
          resultDisplay.textContent = "Result will appear here";
        });

        function updateDigitsInfo(base) {
          if (base === 26) {
            digitsInfo.textContent = "(A-Z)";
          } else {
            let digits = "0-" + Math.min(base - 1, 9);
            if (base > 10)
              digits += ", A-" + String.fromCharCode(65 + base - 11);
            digitsInfo.textContent = `(${digits})`;
          }
        }

        clearAllBtn.addEventListener("click", () => {
          operand1.value = "";
          operand2.value = "";
          resultDisplay.textContent = "Result will appear here";
        });

        copyResultBtn.addEventListener("click", () => {
          const text = resultDisplay.textContent.replace("Result: ", "");
          if (text && text !== "Result will appear here") {
            navigator.clipboard.writeText(text).then(() => {
              copyResultBtn.textContent = "✓";
              setTimeout(() => (copyResultBtn.textContent = "📋"), 2000);
            });
          }
        });

        calculateBtn.addEventListener("click", function () {
          const base = parseInt(baseSelector.value);
          const num1Str = operand1.value.trim().toUpperCase();
          const num2Str = operand2.value.trim().toUpperCase();
          const op = operator.value;

          if (!num1Str || !num2Str)
            return (resultDisplay.textContent = "Enter both numbers");

          try {
            const num1 =
              base === 26 ? parseBase26(num1Str) : parseInt(num1Str, base);
            const num2 =
              base === 26 ? parseBase26(num2Str) : parseInt(num2Str, base);

            if (isNaN(num1) || isNaN(num2))
              throw new Error("Invalid number for this base");

            let result;
            switch (op) {
              case "+":
                result = num1 + num2;
                break;
              case "-":
                result = num1 - num2;
                break;
              case "×":
                result = num1 * num2;
                break;
              case "÷":
                if (num2 === 0) throw new Error("Div by zero");
                result = num1 / num2;
                break;
              case "&":
                result = num1 & num2;
                break;
              case "|":
                result = num1 | num2;
                break;
              case "^":
                result = num1 ^ num2;
                break;
              case "<<":
                result = num1 << num2;
                break;
              case ">>":
                result = num1 >> num2;
                break;
            }

            const wholeNumber = Math.floor(result);
            let wholeStr =
              base === 26
                ? toBase26(wholeNumber)
                : wholeNumber.toString(base).toUpperCase();

            resultDisplay.textContent = `Result: ${wholeStr}`;
            addToHistory({
              type: "calculation",
              base,
              operation: `${num1Str} ${op} ${num2Str}`,
              result: wholeStr,
            });
          } catch (error) {
            resultDisplay.textContent = `Error: ${error.message}`;
          }
        });

        function convertNumber(numberStr, fromBase, toBase) {
          const decimalValue =
            fromBase === 26
              ? parseBase26(numberStr)
              : parseInt(numberStr, fromBase);
          if (isNaN(decimalValue)) throw new Error(`Invalid base ${fromBase}`);
          return toBase === 26
            ? toBase26(decimalValue)
            : decimalValue.toString(toBase).toUpperCase();
        }

        convertBtn.addEventListener("click", function () {
          const numStr = numberToConvert.value.trim().toUpperCase();
          const fB = parseInt(fromBase.value);
          const tB = parseInt(toBase.value);

          if (!numStr) return (conversionResult.textContent = "Enter a number");

          try {
            const res = convertNumber(numStr, fB, tB);
            conversionResult.textContent = `${res} (Base ${tB})`;
            addToHistory({
              type: "conversion",
              fromBase: fB,
              toBase: tB,
              original: numStr,
              result: res,
            });
          } catch (error) {
            conversionResult.textContent = `Error: ${error.message}`;
          }
        });

        function addToHistory(item) {
          let history = JSON.parse(localStorage.getItem("calcHistory") || "[]");
          history.unshift(item);
          if (history.length > 30) history = history.slice(0, 30);
          localStorage.setItem("calcHistory", JSON.stringify(history));
          renderHistory();
        }

        function renderHistory() {
          const history = JSON.parse(
            localStorage.getItem("calcHistory") || "[]",
          );
          historyList.innerHTML = "";
          history.forEach((item) => {
            const li = document.createElement("li");
            if (item.type === "calculation") {
              li.innerHTML = `<span>${item.operation} <small>(b${item.base})</small></span><strong>= ${item.result}</strong>`;
            } else {
              li.innerHTML = `<span>${item.original} <small>(b${item.fromBase}→b${item.toBase})</small></span><strong>= ${item.result}</strong>`;
            }
            historyList.appendChild(li);
          });
        }

        clearHistoryBtn.addEventListener("click", () => {
          localStorage.removeItem("calcHistory");
          renderHistory();
        });

        updateDigitsInfo(10);
        updateBitwiseOperators(10);
        renderHistory();
      });
    </script>
  </body>
</html>
